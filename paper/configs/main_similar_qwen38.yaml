name: main_similar_qwen38
description: Chart review plus 40 retrieved similar earlier patients with their nurse's
  ESI.
cohort: elderly_falls_20261016-114108
ollama_url: http://127.0.0.1:11434
sampling:
  cases: 1000
  order: stratified
  seed: 42
  stratify_head_injury: true
nurse:
  model:
    name: qwen3.8:27b
    source: ollama
    hf_repo: null
    hf_file: null
    temperature: 0.0
    seed: 42
    max_tokens: 8192
    num_ctx: 32768
  sees:
  - age
  - sex
  - chief_complaint
  - arrival_transport
  - vitals
  - hpi
  - past_medical_history
  - medications
  - similar_cases
  system_prompt: "You are an experienced emergency department triage nurse reviewing\
    \ a patient's chart.\nAssign the Emergency Severity Index (ESI) level.\n\nPatient:\
    \ {age}-year-old {sex}, arrived by {arrival_transport}.\nChief complaint: {chief_complaint}\n\
    Triage vital signs: {vitals}\nHistory of present illness: {hpi}\nPast medical\
    \ history: {past_medical_history}\nHome medications: {medications}\n\nSimilar\
    \ earlier patients from this emergency department, with the ESI level their triage\
    \ nurse gave them (for reference only; decide for this patient):\n{similar_cases}\n\
    \nDecide the Emergency Severity Index (ESI) level step by step, as in the ESI\
    \ algorithm:\nA. Does the patient need an immediate life-saving intervention (airway\
    \ or breathing support,\n   emergency medication, or haemodynamic intervention\
    \ such as fluid resuscitation or blood)?\n   If yes: ESI 1.\nB. Is this a high-risk\
    \ situation, or is the patient newly confused, lethargic or disoriented,\n   or\
    \ in severe pain or distress? If yes: ESI 2.\nC. Otherwise, how many different\
    \ types of resources will the patient likely need? Resources\n   are: laboratory\
    \ tests, ECG or X-rays, CT/MRI/ultrasound, IV fluids, IV/IM/nebulised\n   medication,\
    \ specialty consultation, a simple procedure (counts as one) or a complex procedure\n\
    \   (counts as two). History and examination, point-of-care tests, oral medication,\
    \ tetanus\n   shots, simple wound care, splints and slings do not count.\n   None:\
    \ ESI 5. One: ESI 4. Two or more: go to D.\nD. Are the vital signs in the danger\
    \ zone (heart rate above 100, respiratory rate above 20,\n   oxygen saturation\
    \ below 92%)? If yes, consider ESI 2; otherwise ESI 3."
  mode: chart_review
  opening_message: Hello, I'm the triage nurse. What brings you in today?
  max_turns: 12
  similar_cases:
    k: 40
    candidates_per_example: 3
    embedding_model: nomic-embed-text
patient: null
evaluator: null
