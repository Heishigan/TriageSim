  system_prompt: "Answer this board-style question.\n\nA {age}-year-old {sex} arrives\
    \ at the emergency department by {arrival_transport}.\nChief complaint: {chief_complaint}.\
    \ Triage vital signs: {vitals}.\nHistory: {hpi}\nPast medical history: {past_medical_history}.\
    \ Home medications: {medications}.\n\nWhat is the most appropriate Emergency Severity\
    \ Index (ESI) level?\nA) ESI 1   B) ESI 2   C) ESI 3   D) ESI 4   E) ESI 5\n\n\
    Decide the Emergency Severity Index (ESI) level step by step, as in the ESI algorithm:\n\
    A. Does the patient need an immediate life-saving intervention (airway or breathing\
    \ support,\n   emergency medication, or haemodynamic intervention such as fluid\
    \ resuscitation or blood)?\n   If yes: ESI 1.\nB. Is this a high-risk situation,\
    \ or is the patient newly confused, lethargic or disoriented,\n   or in severe\
    \ pain or distress? If yes: ESI 2.\nC. Otherwise, how many different types of\
    \ resources will the patient likely need? Resources\n   are: laboratory tests,\
    \ ECG or X-rays, CT/MRI/ultrasound, IV fluids, IV/IM/nebulised\n   medication,\
    \ specialty consultation, a simple procedure (counts as one) or a complex procedure\n\
    \   (counts as two). History and examination, point-of-care tests, oral medication,\
    \ tetanus\n   shots, simple wound care, splints and slings do not count.\n   None:\
    \ ESI 5. One: ESI 4. Two or more: go to D.\nD. Are the vital signs in the danger\
    \ zone (heart rate above 100, respiratory rate above 20,\n   oxygen saturation\
    \ below 92%)? If yes, consider ESI 2; otherwise ESI 3."
