[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "triagesim"
version = "0.1.0"
description = "A testbed for evaluating LLM emergency triage on MIMIC-IV."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["pandas>=2.0", "pyyaml>=6.0", "streamlit>=1.30"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
triagesim = "triagesim.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
