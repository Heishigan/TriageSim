# Model catalog shown on the Models page. Checked against ollama.com/library on 2026-10-13.
# size_gb: approximate download (default quantization). memory_gb: approximate GPU memory
# to run it fast; it also runs from system RAM on the CPU, much more slowly.
# Cloud models (they run on Ollama's servers) are deliberately not listed: MIMIC data
# must never leave your machine.
tiers:
  laptop: "Laptop or CPU (up to 8 GB)"
  gpu16: "GPU with 12-16 GB"
  gpu24: "GPU with 24 GB"
  gpu48: "GPU with 48 GB or more (workstation or server)"
  embedding: "Embedding models (retrieval patient)"
models:
  # ---- laptop -----------------------------------------------------------------------
