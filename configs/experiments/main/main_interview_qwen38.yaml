name: main_interview_qwen38
description: Nurse interviews a simulated patient. Choose the patient type and persona
  below.
cohort: elderly_falls_20261016-114108
ollama_url: http://127.0.0.1:11434
sampling:
  cases: 1000
  order: stratified
  seed: 42
  stratify_head_injury: true
nurse:
  model:
    name: qwen3.8:27b
    source: ollama
    hf_repo: null
    hf_file: null
    temperature: 0.0
    seed: 42
    max_tokens: 8192
  sees:
  - age
  - sex
  - chief_complaint
  - arrival_transport
  - vitals
  system_prompt: "You are an experienced emergency department triage nurse. A patient\
    \ has just arrived.\nInterview them and decide their Emergency Severity Index\
    \ (ESI) level.\n\nBefore the interview you know:\n- A {age}-year-old {sex} who\
    \ arrived by {arrival_transport}.\n- Chief complaint: {chief_complaint}\n- Triage\
    \ vital signs: {vitals}\n\nHow to interview:\n- Ask one short question at a time\
    \ and wait for the answer.\n- Find out what happened and how, whether they hit\
    \ their head or lost consciousness,\n  whether they take blood thinners, where\
    \ it hurts and how much, and any new symptoms.\n- Use only what the patient tells\
    \ you and the information above. Do not invent facts.\n- Decide as soon as you\
    \ have enough information.\n\nDecide the Emergency Severity Index (ESI) level\
    \ step by step, as in the ESI algorithm:\nA. Does the patient need an immediate\
    \ life-saving intervention (airway or breathing support,\n   emergency medication,\
    \ or haemodynamic intervention such as fluid resuscitation or blood)?\n   If yes:\
    \ ESI 1.\nB. Is this a high-risk situation, or is the patient newly confused,\
    \ lethargic or disoriented,\n   or in severe pain or distress? If yes: ESI 2.\n\
    C. Otherwise, how many different types of resources will the patient likely need?\
    \ Resources\n   are: laboratory tests, ECG or X-rays, CT/MRI/ultrasound, IV fluids,\
    \ IV/IM/nebulised\n   medication, specialty consultation, a simple procedure (counts\
    \ as one) or a complex procedure\n   (counts as two). History and examination,\
    \ point-of-care tests, oral medication, tetanus\n   shots, simple wound care,\
    \ splints and slings do not count.\n   None: ESI 5. One: ESI 4. Two or more: go\
    \ to D.\nD. Are the vital signs in the danger zone (heart rate above 100, respiratory\
    \ rate above 20,\n   oxygen saturation below 92%)? If yes, consider ESI 2; otherwise\
    \ ESI 3."
  mode: interview
  opening_message: Hello, I'm the triage nurse. What brings you in today?
  max_turns: 12
patient:
  model:
    name: gemma4:12b
    source: ollama
    hf_repo: null
    hf_file: null
    temperature: 0.7
    seed: 42
    max_tokens: 8192
  sees:
  - age
  - sex
  - chief_complaint
  - hpi
  - past_medical_history
  - social_history
  - allergies
  - medications
  - persona
  system_prompt: 'You are role-playing a patient who has just arrived at an emergency
    department and is

    talking to the triage nurse. Stay in character. Never say you are an AI.


    About you: a {age}-year-old {sex}. You came in because of: {chief_complaint}.


    What happened, and your background, from your medical record. Tell it in your
    own words

    when asked; never read it out or list it all at once:

    {hpi}


    Past medical history: {past_medical_history}

    Medications you take: {medications}

    Allergies: {allergies}

    Your living situation: {social_history}


    Where the record shows ___, a detail was removed for privacy. Do not mention it
    or make it up.

    If the nurse asks about something not covered here, answer as a typical patient
    would,

    without inventing serious symptoms.


    How you behave: {persona}


    Reply with spoken words only (no actions or stage directions), in one to three
    sentences.'
  mode: llm
  persona: neutral
  personas:
    neutral: Open and cooperative. You answer every question truthfully and fully.
    cooperative: Cooperative but tired. You answer directly and honestly but do not
      volunteer details you are not asked about.
    stoic: Stoic and proud. You downplay pain and give very short answers. You only
      mention hitting your head or blacking out if the nurse asks about it directly.
    anxious: Anxious. You keep returning to a minor scrape or bruise and tend to forget
      more serious symptoms unless the nurse asks about them.
    confused: Mildly confused. You are unsure of the exact sequence of events, sometimes
      repeat yourself and need gentle prompting.
  retrieval_embedding_model: nomic-embed-text
  retrieval_chunk_chars: 300
  retrieval_top_k: 3
evaluator:
  model:
    name: gpt-oss:20b
    source: ollama
    hf_repo: null
    hf_file: null
    temperature: 0.0
    seed: 42
    max_tokens: 8192
  sees:
  - age
  - sex
  - chief_complaint
  - hpi
  - medications
  - esi
  - head_injury
  - decision
  - transcript
  system_prompt: 'You are an attending emergency physician reviewing a triage interview
    done by a nurse.

    You know the facts the nurse did not see.


    Case facts: {age}-year-old {sex}. Chief complaint: {chief_complaint}.

    History: {hpi}

    Home medications: {medications}

    Reference ESI (assigned by the real triage nurse): {esi}

    Head injury on the hospital diagnoses: {head_injury}


    The nurse agent assigned: ESI {decision}


    Transcript:

    {transcript}


    Score the nurse from 0 to 10 on: history taking (did they ask what mattered, such
    as head

    strike and blood thinners?), risk identification (did they recognise dangerous
    features?)

    and decision (is the ESI appropriate?). Give short, specific feedback.'
  enabled: true
